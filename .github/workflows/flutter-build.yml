name: Build Flutter Android APK & iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Flutter project scaffolding
        run: flutter create --org xyz.hesn --project-name rdmns_flutter .

      - name: Ensure MainActivity extends FlutterFragmentActivity for local_auth
        run: |
          python3 -c "
          import os
          path = 'android/app/src/main/kotlin/xyz/hesn/rdmns_flutter/MainActivity.kt'
          os.makedirs(os.path.dirname(path), exist_ok=True)
          with open(path, 'w') as f:
              f.write('package xyz.hesn.rdmns_flutter\n\nimport io.flutter.embedding.android.FlutterFragmentActivity\n\nclass MainActivity: FlutterFragmentActivity() {\n}\n')
          "

      - name: Update minSdk, compileSdk, and desugaring for flutter_local_notifications
        run: |
          python3 -c "
          path = 'android/app/build.gradle'
          with open(path, 'r') as f:
              content = f.read()
          content = content.replace('minSdk = flutter.minSdkVersion', 'minSdk 24')
          content = content.replace('minSdk flutter.minSdkVersion', 'minSdk 24')
          content = content.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk 36')
          content = content.replace('compileSdk flutter.compileSdkVersion', 'compileSdk 36')
          if 'coreLibraryDesugaringEnabled' not in content:
              content = content.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true')
              content += '\ndependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.0.4\"\n}\n'
          with open(path, 'w') as f:
              f.write(content)
          "

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK (ARM64 Optimized)
        run: flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Upload Artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.1.0
          name: "Rdmns Mobile App v1.1.0"
          files: build/app/outputs/flutter-apk/app-release.apk

      - name: Send APK to Telegram
        env:
          TELEGRAM_TOKEN: "8220698805:AAHHTHiEZ23axyTcOLyoPBWCl3MoUN9Qr88"
          TELEGRAM_CHAT_ID: "337041776"
        run: |
          curl -F chat_id="$TELEGRAM_CHAT_ID" -F document=@"build/app/outputs/flutter-apk/app-release.apk" -F caption="💙 Rdmns Flutter Android App (Unique Device Token v1.1.0)%0A%0ADirect Link: https://github.com/heshanga/Rdmns-Flutter/releases/tag/v1.1.0" "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendDocument"

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Flutter project scaffolding
        run: flutter create --org xyz.hesn --project-name rdmns_flutter .

      - name: Add FaceID permission to Info.plist
        run: |
          python3 -c "
          path = 'ios/Runner/Info.plist'
          with open(path, 'r') as f:
              content = f.read()
          if 'NSFaceIDUsageDescription' not in content:
              content = content.replace('<dict>', '<dict>\n\t<key>NSFaceIDUsageDescription</key>\n\t<string>We use Face ID / Touch ID to secure access to the Rdmns app.</string>')
              with open(path, 'w') as f:
                  f.write(content)
          "

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App Simulator (Unsigned)
        run: flutter build ios --simulator

      - name: Clean Headers & Create Ultra-Compressed IPA
        run: |
          mkdir -p build/Payload
          cp -r build/ios/iphonesimulator/Runner.app build/Payload/
          find build/Payload -name "*.h" -delete || true
          find build/Payload -name "*.modulemap" -delete || true
          cd build
          zip -9 -r Rdmns_Flutter_v1.1.0.ipa Payload

      - name: Upload Artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.1.0
          name: "Rdmns Mobile App v1.1.0"
          files: build/Rdmns_Flutter_v1.1.0.ipa

      - name: Send IPA & Direct Release Link to Telegram
        env:
          TELEGRAM_TOKEN: "8220698805:AAHHTHiEZ23axyTcOLyoPBWCl3MoUN9Qr88"
          TELEGRAM_CHAT_ID: "337041776"
        run: |
          curl -F chat_id="$TELEGRAM_CHAT_ID" -F document=@"build/Rdmns_Flutter_v1.1.0.ipa" -F caption="🍏 Rdmns Flutter iOS App (Unique Device Token v1.1.0)%0A%0ADirect Link: https://github.com/heshanga/Rdmns-Flutter/releases/tag/v1.1.0" "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendDocument" || \
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" -d chat_id="$TELEGRAM_CHAT_ID" -d text="🍏 Rdmns Flutter iOS App (v1.1.0) is ready! Download directly from GitHub Releases: https://github.com/heshanga/Rdmns-Flutter/releases/tag/v1.1.0"
