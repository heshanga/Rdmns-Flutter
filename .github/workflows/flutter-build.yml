name: Build Flutter Android APK & iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.6' # last version that works with AGP 8.9.1 in android/settings.gradle

      - name: Generate Flutter project scaffolding
        run: flutter create --org xyz.hesn --project-name rdmns_flutter .

      - name: Configure android/local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=/usr/local/lib/android/sdk" >> android/local.properties

      - name: Ensure MainActivity extends FlutterFragmentActivity for local_auth
        run: |
          python3 -c "
          import os
          path = 'android/app/src/main/kotlin/xyz/hesn/rdmns_flutter/MainActivity.kt'
          os.makedirs(os.path.dirname(path), exist_ok=True)
          if not os.path.exists(path):  # the repo's MainActivity.kt (screen-reader protection) is kept
              with open(path, 'w') as f:
                  f.write('package xyz.hesn.rdmns_flutter\n\nimport io.flutter.embedding.android.FlutterFragmentActivity\n\nclass MainActivity: FlutterFragmentActivity() {\n}\n')
          "

      - name: Install dependencies
        run: flutter pub get

      - name: Decrypt release signing key
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          if [ -z "$ANDROID_SIGNING_PASSWORD" ]; then
            echo "::error::Add the ANDROID_SIGNING_PASSWORD repository secret (see SIGNING.md). Without it the APK would be signed with a random key and could not update the installed app."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/rdmns-release.jks.enc -out android/app/rdmns-release.jks -pass env:ANDROID_SIGNING_PASSWORD
          printf 'storeFile=rdmns-release.jks\nstorePassword=%s\nkeyAlias=rdmns\nkeyPassword=%s\n' "$ANDROID_SIGNING_PASSWORD" "$ANDROID_SIGNING_PASSWORD" > android/key.properties

      - name: Build Android APK (ARM64 Optimized)
        run: flutter build apk --release --build-name=1.2.5 --build-number=25 --target-platform android-arm64 --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Upload Artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.2.5
          name: "Rdmns Mobile App v1.2.5"
          files: build/app/outputs/flutter-apk/app-release.apk

      - name: Send APK to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then echo "Telegram secrets not set - skipping"; exit 0; fi
          curl -F chat_id="$TELEGRAM_CHAT_ID" -F document=@"build/app/outputs/flutter-apk/app-release.apk" -F caption="💙 Rdmns Flutter Android App (v1.2.5 AI assistant tab)%0A%0ADirect Link: https://github.com/heshanga/Rdmns-Flutter/releases/tag/v1.2.5" "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendDocument"

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.6' # last version that works with AGP 8.9.1 in android/settings.gradle

      - name: Generate Flutter project scaffolding
        run: flutter create --org xyz.hesn --project-name rdmns_flutter .

      - name: Add FaceID, location and microphone permissions to Info.plist
        run: |
          python3 -c "
          path = 'ios/Runner/Info.plist'
          with open(path, 'r') as f:
              content = f.read()
          keys = {
              'NSFaceIDUsageDescription': 'We use Face ID / Touch ID to secure access to the Rdmns app.',
              'NSLocationWhenInUseUsageDescription': 'Your location is used only when you choose to share live train GPS.',
              'NSMicrophoneUsageDescription': 'The microphone is used only when you talk to the RDMNS AI assistant.',
              'NSSpeechRecognitionUsageDescription': 'Speech recognition turns your question to the RDMNS AI assistant into text.',
          }
          for k, v in keys.items():
              if k not in content:
                  content = content.replace('<dict>', '<dict>\n\t<key>' + k + '</key>\n\t<string>' + v + '</string>', 1)
          with open(path, 'w') as f:
              f.write(content)
          "

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App Simulator (Unsigned)
        run: flutter build ios --simulator --build-name=1.2.5 --build-number=25

      - name: Clean Headers & Create Ultra-Compressed IPA
        run: |
          mkdir -p build/Payload
          cp -r build/ios/iphonesimulator/Runner.app build/Payload/
          find build/Payload -name "*.h" -delete || true
          find build/Payload -name "*.modulemap" -delete || true
          cd build
          zip -9 -r Rdmns_Flutter_v1.2.5.ipa Payload

      - name: Upload Artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.2.5
          name: "Rdmns Mobile App v1.2.5"
          files: build/Rdmns_Flutter_v1.2.5.ipa

      - name: Send IPA & Direct Release Link to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then echo "Telegram secrets not set - skipping"; exit 0; fi
          curl -F chat_id="$TELEGRAM_CHAT_ID" -F document=@"build/Rdmns_Flutter_v1.2.5.ipa" -F caption="🍏 Rdmns Flutter iOS App (v1.2.5)%0A%0ADirect Link: https://github.com/heshanga/Rdmns-Flutter/releases/tag/v1.2.5" "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendDocument" || \
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" -d chat_id="$TELEGRAM_CHAT_ID" -d text="🍏 Rdmns Flutter iOS App (v1.2.5) is ready! Download directly from GitHub Releases: https://github.com/heshanga/Rdmns-Flutter/releases/tag/v1.2.5"
