name: Build Flutter Android APK & iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Flutter project scaffolding
        run: flutter create --org xyz.hesn --project-name rdmns_flutter .

      - name: Update minSdk, compileSdk, and desugaring for flutter_local_notifications
        run: |
          python3 -c "
          path = 'android/app/build.gradle'
          with open(path, 'r') as f:
              content = f.read()
          content = content.replace('minSdk = flutter.minSdkVersion', 'minSdk 24')
          content = content.replace('minSdk flutter.minSdkVersion', 'minSdk 24')
          content = content.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk 36')
          content = content.replace('compileSdk flutter.compileSdkVersion', 'compileSdk 36')
          if 'coreLibraryDesugaringEnabled' not in content:
              content = content.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true')
              content += '\ndependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.0.4\"\n}\n'
          with open(path, 'w') as f:
              f.write(content)
          "

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK (ARM64 Optimized)
        run: flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.7
          name: "Rdmns Mobile App v1.0.7"
          files: build/app/outputs/flutter-apk/app-release.apk

      - name: Send APK to Telegram
        env:
          TELEGRAM_TOKEN: "8220698805:AAHHTHiEZ23axyTcOLyoPBWCl3MoUN9Qr88"
          TELEGRAM_CHAT_ID: "337041776"
        run: |
          curl -F chat_id="$TELEGRAM_CHAT_ID" -F document=@"build/app/outputs/flutter-apk/app-release.apk" -F caption="💙 Rdmns Flutter Android App (v1.0.7)%0A%0ADirect Download: https://github.com/heshanga/Rdmns-Flutter/releases/download/v1.0.7/app-release.apk" "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendDocument"

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Flutter project scaffolding
        run: flutter create --org xyz.hesn --project-name rdmns_flutter .

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App Simulator (Unsigned)
        run: flutter build ios --simulator

      - name: Create Payload and Zip IPA (High Compression)
        run: |
          mkdir -p build/Payload
          cp -r build/ios/iphonesimulator/Runner.app build/Payload/
          cd build
          zip -9 -r Rdmns_Flutter_v1.0.7.ipa Payload

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.7
          name: "Rdmns Mobile App v1.0.7"
          files: build/Rdmns_Flutter_v1.0.7.ipa

      - name: Send IPA to Telegram
        env:
          TELEGRAM_TOKEN: "8220698805:AAHHTHiEZ23axyTcOLyoPBWCl3MoUN9Qr88"
          TELEGRAM_CHAT_ID: "337041776"
        run: |
          curl -F chat_id="$TELEGRAM_CHAT_ID" -F document=@"build/Rdmns_Flutter_v1.0.7.ipa" -F caption="🍏 Rdmns Flutter iOS App (v1.0.7)%0A%0ADirect Download: https://github.com/heshanga/Rdmns-Flutter/releases/download/v1.0.7/Rdmns_Flutter_v1.0.7.ipa" "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendDocument"
