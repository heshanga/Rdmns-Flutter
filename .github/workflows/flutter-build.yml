name: Build Flutter Android APK & iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Flutter project scaffolding
        run: flutter create --org xyz.hesn --project-name rdmns_flutter .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Send APK to Telegram
        env:
          TELEGRAM_TOKEN: "8220698805:AAHHTHiEZ23axyTcOLyoPBWCl3MoUN9Qr88"
          TELEGRAM_CHAT_ID: "337041776"
        run: |
          curl -F chat_id="$TELEGRAM_CHAT_ID" -F document=@"build/app/outputs/flutter-apk/app-release.apk" -F caption="💙 Rdmns Flutter Android App (APK Build v1.0.7)" "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendDocument"

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Flutter project scaffolding
        run: flutter create --org xyz.hesn --project-name rdmns_flutter .

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App
        run: flutter build ios --release --no-codesign

      - name: Create Payload and Zip IPA
        run: |
          mkdir -p build/Payload
          cp -r build/ios/iphoneos/Runner.app build/Payload/
          cd build
          zip -r Rdmns_Flutter_v1.0.7.ipa Payload

      - name: Send IPA to Telegram
        env:
          TELEGRAM_TOKEN: "8220698805:AAHHTHiEZ23axyTcOLyoPBWCl3MoUN9Qr88"
          TELEGRAM_CHAT_ID: "337041776"
        run: |
          curl -F chat_id="$TELEGRAM_CHAT_ID" -F document=@"build/Rdmns_Flutter_v1.0.7.ipa" -F caption="🍏 Rdmns Flutter iOS App (IPA Build v1.0.7)" "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendDocument"
