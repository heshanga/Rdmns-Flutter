plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "xyz.hesn.rdmns_flutter"
    compileSdk 36

    defaultConfig {
        applicationId "xyz.hesn.rdmns"
        minSdk 24
        targetSdk 36
        versionCode 8
        versionName "1.0.7"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}
